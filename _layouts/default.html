<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b12">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title and page.title != site.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="icon" href="{{ '/assets/images/site-mark.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
  </head>
  <body class="{% if page.home %}is-home{% else %}is-article{% endif %}">
    <a class="skip-link" href="#main-content">跳到正文</a>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="site-header" data-site-header>
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="返回首页">
        <img src="{{ '/assets/images/site-mark.svg' | relative_url }}" alt="" width="34" height="34">
        <span class="brand-copy">
          <strong>ISAAC / RL</strong>
          <small><i></i> LEARNING LOG</small>
        </span>
      </a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span>
        <span class="sr-only">打开导航</span>
      </button>

      <nav class="site-nav" id="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/Isaac学习内容/00_阅读索引.html' | relative_url }}">学习路线</a>
        <a href="{{ '/Isaac学习内容/00_部署与Go2项目流程.html' | relative_url }}">部署记录</a>
        <a href="{{ '/发布指南.html' | relative_url }}">发布指南</a>
      </nav>
    </header>

    <div class="reading-progress" aria-hidden="true"><span data-progress></span></div>

    {% if page.home %}
      <main id="main-content" class="home-main">
        {{ content }}
      </main>
    {% else %}
      <main id="main-content" class="article-shell">
        <article class="article-card prose">
          <div class="article-kicker">
            <span>ISAAC LEARNING ARCHIVE</span>
            <span data-reading-time></span>
          </div>
          {{ content }}
        </article>
        <aside class="page-toc" aria-label="本页目录">
          <p>本页目录</p>
          <nav data-toc></nav>
          <a class="back-to-top" href="#main-content">返回顶部 ↑</a>
        </aside>
      </main>
    {% endif %}

    <footer class="site-footer">
      <div>
        <img src="{{ '/assets/images/site-mark.svg' | relative_url }}" alt="" width="28" height="28">
        <p><strong>Isaac Lab × Go2</strong><br><span>持续学习，持续验证。</span></p>
      </div>
      <p>Built as a public learning archive · {{ site.time | date: '%Y' }}</p>
    </footer>

    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
